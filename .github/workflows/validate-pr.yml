name: Validate Asterisk add-on PR

on:
  pull_request:
    paths:
      - 'asterisk/**'
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/validate-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: |
          python -m py_compile \
            asterisk/rootfs/opt/asterisk-ha/bootstrap.py \
            asterisk/rootfs/opt/asterisk-ha/backend.py \
            asterisk/rootfs/opt/asterisk-ha/nat.py \
            asterisk/rootfs/opt/asterisk-ha/network.py \
            asterisk/rootfs/opt/asterisk-ha/ui.py \
            asterisk/rootfs/opt/asterisk-ha/ht503.py \
            asterisk/rootfs/opt/asterisk-ha/dashboard_status.py \
            asterisk/rootfs/opt/asterisk-ha/sipcord.py \
            asterisk/rootfs/opt/asterisk-ha/ivr_audio.py \
            asterisk/rootfs/opt/asterisk-ha/ivr.py \
            asterisk/rootfs/opt/asterisk-ha/ha_state.py \
            asterisk/rootfs/opt/asterisk-ha/fail2ban_setup.py \
            asterisk/rootfs/opt/asterisk-ha/security_status.py \
            asterisk/rootfs/opt/asterisk-ha/server.py \
            asterisk/rootfs/opt/asterisk-ha/server_entry.py
          python -m py_compile custom_components/asterisk_pbx/*.py

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/asterisk_pbx/manifest.json >/dev/null
          python -m json.tool custom_components/asterisk_pbx/strings.json >/dev/null
          python -m json.tool custom_components/asterisk_pbx/translations/pt.json >/dev/null
          python -m json.tool custom_components/asterisk_pbx/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Build final Ingress UI, endpoint and RTP policy
        env:
          PYTHONPATH: asterisk/rootfs/opt/asterisk-ha
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import backend
          import server_entry

          data = {
              'extensions': [
                  {'extension':'100','callerid':'PC','secret':'pc-secret','voicemail_pin':'1234','context':'from-internal'},
                  {'extension':'101','callerid':'Remoto','secret':'remote-secret','voicemail_pin':'1234','context':'from-internal'},
              ],
              'network': {
                  'auto_external': False,
                  'external_address': '203.0.113.44',
                  'auto_local_nets': False,
                  'local_nets': ['192.168.1.0/24'],
                  'rtp_keepalive': 15,
                  'rtp_timeout': 30,
                  'rtp_timeout_hold': 300,
                  'session_timers': True,
              },
              'ht503': {
                  'enabled': True,
                  'fxo_user': '218277581',
                  'fxo_secret': 'fxo-secret',
                  'fxs_enabled': True,
                  'fxs_extension': '200',
                  'fxs_callerid': 'Tel Interno',
                  'fxs_secret': 'test-secret',
                  'fxs_voicemail_pin': '1234',
                  'fxs_context': 'from-internal',
              },
              'sipcord': {
                  'enabled': True,
                  'server': 'bridge-eu1.sipcord.net',
                  'port': 5060,
                  'username': 'test-user',
                  'password': 'test-pass',
                  'dial_pattern': '_15XX',
              },
          }
          data, changed, removed = server_entry.normalize_pbx(data)
          assert removed == []
          assert data['ht503']['fxs_local_sip_port'] == 5062
          ext = next(e for e in data['extensions'] if e['extension'] == '200')
          assert ext['secret'] == 'test-secret'
          assert ext['callerid'] == 'Tel Interno'

          with TemporaryDirectory() as d:
              conf = Path(d)
              backend.CONF = conf
              server_entry.server.CONF = conf
              (conf/'pjsip.conf').write_text('[global]\ntype=global\n\n[transport-udp]\ntype=transport\nprotocol=udp\nbind=0.0.0.0:5060\nallow_reload=yes\n\n#include pjsip_gui.conf\n')
              server_entry.server.render_managed(data)
              pjs = (conf / 'pjsip_gui.conf').read_text()
              transport = (conf / 'pjsip.conf').read_text()
              assert '[100]' in pjs and '[101]' in pjs and '[200]' in pjs
              assert 'username=200' in pjs
              assert 'password=test-secret' in pjs
              assert 'identify_by=username,auth_username' in pjs
              assert 'allow=ulaw,alaw' in pjs
              assert 'opus' not in pjs.lower(), pjs
              assert pjs.count('rtp_keepalive=15') == 4, pjs
              assert pjs.count('rtp_timeout=30') == 4, pjs
              assert pjs.count('rtp_timeout_hold=300') == 4, pjs
              assert pjs.count('timers_sess_expires=180') == 4, pjs
              assert 'external_media_address=203.0.113.44' in transport
              assert 'external_signaling_address=203.0.113.44' in transport
              assert 'local_net=192.168.1.0/24' in transport
              assert transport.index('external_media_address=203.0.113.44') < transport.index('#include pjsip_gui.conf')
              assert transport.index('local_net=192.168.1.0/24') < transport.index('#include pjsip_gui.conf')

          html = server_entry.server.INDEX
          assert "'HT503 FXS / FXO'" in html
          assert "'SIPcord / Discord'" in html
          assert "'IVR'" in html
          assert "'Rede / NAT'" in html
          assert 'FXS — telefone analógico' in html
          assert 'FXO — linha exterior / PSTN' in html
          assert 'Guardar FXS + FXO' in html
          assert 'Gravar pelo telefone' in html
          assert 'function dashboardStatusCard' in html
          assert 'Extensões PJSIP' in html
          assert 'Grandstream HT503' in html
          assert 'SIPcord / Discord' in html
          assert 'RTP timeout chamada' in html
          assert 'Detetar IP público/LAN' in html
          assert "api('api/ha-state')" in html
          assert "api('api/security')" in html
          assert 'Fail2ban' in html

          match = re.search(r'<script>(.*)</script>', html, re.S)
          assert match, 'Final HTML has no script block'
          Path('/tmp/asterisk-ui-final.js').write_text(match.group(1))
          Path('/tmp/asterisk-ui-final.html').write_text(html)
          PY

      - name: Check final JavaScript syntax
        run: node --check /tmp/asterisk-ui-final.js

      - name: Test Fail2ban security policy rendering
        env:
          PYTHONPATH: asterisk/rootfs/opt/asterisk-ha
        run: |
          python - <<'PY'
          import ipaddress
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import fail2ban_setup
          import server

          with TemporaryDirectory() as d:
              base = Path(d)
              root = base/'etc-fail2ban'
              data = base/'data'
              log = base/'asterisk-full.log'
              state = fail2ban_setup.render({
                  'fail2ban_enabled': True,
                  'fail2ban_bantime': 3600,
                  'fail2ban_findtime': 600,
                  'fail2ban_maxretry': 5,
                  'fail2ban_web_maxretry': 10,
                  'sip_port': 5060,
                  'tls_port': 5061,
                  'fail2ban_ignoreip': '192.168.1.0/24',
              }, root=root, data_dir=data, asterisk_log=log)
              jail = (root/'jail.d'/'asterisk-ha.local').read_text()
              sipfilter = (root/'filter.d'/'asterisk-ha-pjsip.conf').read_text()
              webfilter = (root/'filter.d'/'asterisk-ha-web.conf').read_text()
              assert state['enabled'] is True
              assert 'nftables-multiport' in jail
              assert 'protocol=udp' in jail and 'protocol=tcp' in jail
              assert 'bantime.increment = true' in jail
              assert '192.168.1.0/24' in jail
              assert "Request 'REGISTER'" in sipfilter
              assert "Request 'INVITE'" in sipfilter
              assert 'INVITE.*No matching endpoint' not in sipfilter
              assert 'PBX-WEB' in webfilter
              assert str(log) in jail

          private = ipaddress.ip_address('192.168.1.20')
          public = ipaddress.ip_address('8.8.8.8')
          assert any(private in n for n in server.TRUSTED_WEB_NETWORKS)
          assert not any(public in n for n in server.TRUSTED_WEB_NETWORKS)
          source = Path('asterisk/rootfs/opt/asterisk-ha/server.py').read_text()
          assert 'Sensitive credentials endpoint disabled' in source
          assert 'public-direct-blocked' in source
          PY

      - name: Test automatic SIP and RTP NAT policy
        env:
          PYTHONPATH: asterisk/rootfs/opt/asterisk-ha
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import nat

          with TemporaryDirectory() as d:
              d = Path(d)
              pjs = d / 'pjsip.conf'
              rtp = d / 'rtp.conf'
              pjs.write_text('[transport-udp]\ntype=transport\nprotocol=udp\nbind=0.0.0.0:5060\nallow_reload=yes\n\n#include pjsip_gui.conf\n')
              rtp.write_text('[general]\nrtpstart=10000\nrtpend=20000\nice_support=yes\nstunaddr=\n')
              state = {
                  'local_net':'192.168.1.0/24',
                  'external_address':'203.0.113.44',
                  'sip_port':5060,
              }
              nat.patch_transport(pjs, state)
              nat.patch_rtp(rtp)
              out = pjs.read_text()
              assert 'symmetric_transport=yes' in out
              assert 'local_net=192.168.1.0/24' in out
              assert 'external_media_address=203.0.113.44' in out
              assert 'external_signaling_address=203.0.113.44' in out
              assert 'external_signaling_port=5060' in out
              include = out.index('#include pjsip_gui.conf')
              assert out.index('symmetric_transport=yes') < include
              assert out.index('local_net=192.168.1.0/24') < include
              assert out.index('external_media_address=203.0.113.44') < include
              assert 'stunaddr=' not in rtp.read_text()
          assert nat._valid_network('auto') == ''
          assert nat._valid_network('192.168.1.44/24') == '192.168.1.0/24'
          PY

      - name: Test Asterisk 22 PJSIP reload compatibility
        env:
          PYTHONPATH: asterisk/rootfs/opt/asterisk-ha
        run: |
          python - <<'PY'
          import server_entry

          calls = []
          def success(command):
              calls.append(command)
              return {'ok': True, 'code': 0, 'output': "Module 'res_pjsip.so' reloaded successfully."}

          server_entry._base_ast = success
          result = server_entry.ast_compat('pjsip reload')
          assert result['ok']
          assert calls == ['module reload res_pjsip.so']
          assert '$ module reload res_pjsip.so' in result['output']

          calls = []
          def fallback(command):
              calls.append(command)
              if command == 'module reload res_pjsip.so':
                  return {'ok': True, 'code': 0, 'output': 'No such module'}
              return {'ok': True, 'code': 0, 'output': 'Reloading Asterisk modules...'}

          server_entry._base_ast = fallback
          result = server_entry.ast_compat('pjsip reload')
          assert result['ok']
          assert calls == ['module reload res_pjsip.so', 'core reload']
          assert 'Fallback: $ core reload' in result['output']
          PY

      - name: Test IVR generator
        env:
          PYTHONPATH: asterisk/rootfs/opt/asterisk-ha
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ivr import ensure_ivr_state, validate_ivrs, render_ivrs
          data={'extensions':[{'extension':'100'}],'ht503':{'enabled':True,'fxo_user':'218277581'},'sipcord':{'enabled':True},'gsm_dongles':[{'name':'dongle0'}],'ivrs':[{'enabled':True,'id':'main','name':'Principal','extension':'600','prompt':'custom/ivr-main','timeout':5,'retries':3,'fallback_type':'extension','fallback_value':'100','options':[{'digit':'1','type':'extension','value':'100'},{'digit':'2','type':'sipcord','value':'1515'}]}]}
          data,_=ensure_ivr_state(data); validate_ivrs(data)
          with TemporaryDirectory() as d:
              conf=Path(d); (conf/'extensions_gui.conf').write_text('; test\n'); render_ivrs(conf,data)
              entry=(conf/'extensions_gui.conf').read_text(); ivr=(conf/'extensions_ivr_gui.conf').read_text()
              assert 'exten => 600,1,NoOp(IVR main)' in entry
              assert 'exten => *77600,1,NoOp(Record IVR main prompt)' in entry
              assert 'Record(/share/asterisk-ivr/ivr-main.wav,3,120,k)' in entry
              assert '[ivr-main]' in ivr
              assert 'Dial(PJSIP/1515@sipcord,90)' in ivr
          PY

      - name: Test IVR WAV storage
        env:
          PYTHONPATH: asterisk/rootfs/opt/asterisk-ha
        run: |
          python - <<'PY'
          import base64, io, math, struct, wave
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import ivr_audio
          buf=io.BytesIO()
          with wave.open(buf,'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(16000)
              frames=bytearray()
              for n in range(1600):
                  s=int(8000*math.sin(2*math.pi*440*n/16000)); frames += struct.pack('<hh',s,s)
              w.writeframes(bytes(frames))
          with TemporaryDirectory() as d:
              ivr_audio.RECORDINGS=Path(d)
              r=ivr_audio.save_upload('IVR Main.wav',base64.b64encode(buf.getvalue()).decode())
              assert r['sound_id']=='custom/ivr-main'
              p=Path(d)/'ivr-main.wav'; assert p.exists()
              with wave.open(str(p),'rb') as w:
                  assert (w.getnchannels(),w.getsampwidth(),w.getframerate())==(1,2,8000)
              assert ivr_audio.delete_recording('ivr-main') is True
          PY

      - name: Check integration hooks
        run: |
          grep -q 'from-ht503-fxo' asterisk/rootfs/etc/asterisk-template/extensions.conf
          grep -q 'extensions_ivr_gui.conf' asterisk/rootfs/etc/asterisk-template/extensions.conf
          grep -q 'auth_username' asterisk/rootfs/etc/asterisk-template/pjsip.conf
          grep -q '/api/ha-state' asterisk/rootfs/opt/asterisk-ha/server.py
          grep -q '/api/security' asterisk/rootfs/opt/asterisk-ha/server.py
          grep -q 'Sensitive credentials endpoint disabled' asterisk/rootfs/opt/asterisk-ha/server.py
          grep -q '/api/ivr-upload' asterisk/rootfs/opt/asterisk-ha/server.py
          grep -q 'server_entry.py' asterisk/rootfs/usr/local/bin/asterisk-ha-start
          grep -q 'fail2ban-client -x start' asterisk/rootfs/usr/local/bin/asterisk-ha-start
          grep -q '/share/asterisk-ivr' asterisk/rootfs/usr/local/bin/asterisk-ha-start
          grep -q 'fxs_secret' asterisk/rootfs/opt/asterisk-ha/ht503.py
          grep -q 'module reload res_pjsip.so' asterisk/rootfs/opt/asterisk-ha/server_entry.py
          grep -q 'dashboard_status' asterisk/rootfs/opt/asterisk-ha/server_entry.py
          grep -q 'augment_network_index' asterisk/rootfs/opt/asterisk-ha/server_entry.py
          grep -q "DEFAULT_AUDIO_CODECS='ulaw,alaw'" asterisk/rootfs/opt/asterisk-ha/backend.py
          grep -q 'rtp_timeout=30' asterisk/rootfs/opt/asterisk-ha/backend.py
          grep -q 'apply_nat' asterisk/rootfs/opt/asterisk-ha/bootstrap.py
          grep -q 'symmetric_transport=yes' asterisk/rootfs/opt/asterisk-ha/nat.py
          grep -q 'RTP timeout chamada' asterisk/rootfs/opt/asterisk-ha/network.py
          grep -q 'NET_ADMIN' asterisk/config.yaml
          grep -q 'fail2ban nftables' asterisk/Dockerfile
          grep -q 'asterisk_pbx' custom_components/asterisk_pbx/manifest.json
