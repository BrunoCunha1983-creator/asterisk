name: Asterisk 22 PBX + GSM
version: "0.2.5"
slug: asterisk22_pbx
description: "Asterisk 22.11 PBX for Home Assistant with separated live Dashboard status panels, unified ulaw/alaw codecs, HT503 FXS/FXO, Asterisk 22 compatible PJSIP reload, SIPcord/Discord, IVR audio manager, Home Assistant entities, AMI, ARI, Ingress GUI and optional chan_dongle GSM"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-classic
panel_title: Asterisk PBX
host_network: true
usb: true
uart: true
udev: true
apparmor: false
hassio_api: true
homeassistant_api: true
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
options:
  timezone: Europe/Lisbon
  sip_port: 5060
  tls_port: 5061
  ami_port: 5038
  ari_port: 8088
  rtp_start: 10000
  rtp_end: 20000
  chan_dongle: true
  verbose: 3
schema:
  timezone: str
  sip_port: port
  tls_port: port
  ami_port: port
  ari_port: port
  rtp_start: int(1024,65535)
  rtp_end: int(1024,65535)
  chan_dongle: bool
  verbose: int(0,9)
