[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RECORDING_DIR=/share/asterisk-recordings

[from-internal]
; ECHO TEST MANAGED BY ASTERISK HA
exten => 6000,1,NoOp(Asterisk RTP Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,PlayTones(1000/500)
 same => n,Wait(1)
 same => n,StopPlayTones()
 same => n,Echo()
 same => n,Hangup()
exten => *43,1,Goto(from-internal,6000,1)
; END ECHO TEST MANAGED BY ASTERISK HA
exten => *60,1,Answer()
 same => n,SayUnixTime()
 same => n,Hangup()
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
exten => _*98X.,1,VoiceMailMain(${EXTEN:3}@default)
#include extensions_gui.conf

[from-ht503-fxo]
#include extensions_ht503_gui.conf

[from-dongle]
#include extensions_dongle_gui.conf

; Generated IVR contexts are complete context sections.
#include extensions_ivr_gui.conf
