[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RECORDING_DIR=/share/asterisk-recordings

[from-internal]
; ECHO TEST MANAGED BY ASTERISK HA
exten => 6000,1,NoOp(Asterisk RTP Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,PlayTones(1000/500)
 same => n,Wait(1)
 same => n,StopPlayTones()
 same => n,Echo()
 same => n,Hangup()
exten => *43,1,Goto(from-internal,6000,1)
; END ECHO TEST MANAGED BY ASTERISK HA

; SERVICO DESPERTAR MANAGED BY ASTERISK HA
; *68 -> define/substitui um despertar único para a própria extensão.
; Introduzir a hora em quatro dígitos HHMM (ex.: 0730).
exten => *68,1,NoOp(Servico Despertar - programar para ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Read(WAKEUP_TIME,beep,4,,3,12)
 same => n,GotoIf($["${WAKEUP_TIME}"=""]?wakeup-invalid)
 same => n,System(/usr/bin/python3 /opt/asterisk-ha/wakeup_phone.py set "${CALLERID(num)}" "${WAKEUP_TIME}")
 same => n,GotoIf($["${SYSTEMSTATUS}"="SUCCESS"]?wakeup-ok:wakeup-invalid)
 same => n(wakeup-ok),SayDigits(${WAKEUP_TIME})
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(wakeup-invalid),Playback(invalid)
 same => n,Hangup()

; *69 -> cancela o despertar criado por *68 para a própria extensão.
exten => *69,1,NoOp(Servico Despertar - cancelar para ${CALLERID(num)})
 same => n,Answer()
 same => n,System(/usr/bin/python3 /opt/asterisk-ha/wakeup_phone.py cancel "${CALLERID(num)}")
 same => n,Playback(beep)
 same => n,Hangup()
; END SERVICO DESPERTAR MANAGED BY ASTERISK HA

exten => *60,1,Answer()
 same => n,SayUnixTime()
 same => n,Hangup()
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
exten => _*98X.,1,VoiceMailMain(${EXTEN:3}@default)
#include extensions_gui.conf

[from-ht503-fxo]
#include extensions_ht503_gui.conf

[from-dongle]
#include extensions_dongle_gui.conf

; Generated IVR contexts are complete context sections.
#include extensions_ivr_gui.conf
